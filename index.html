<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>걱걱걱 귀신 게임</title>
<style>
  :root {
    --bg: #0b0d0c;
    --wall: #1c2420;
    --door: #3d4a43;
    --door-edge: #2a342f;
    --text: #d9e0dc;
    --dim: #7c8a83;
    --red: #c22323;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #game {
    position: relative;
    width: 100%;
    max-width: 960px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  /* 형광등 깜빡임 */
  #light {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,230,210,.13), transparent 60%);
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 18%, 22%, 60%, 63%, 100% { opacity: 1; }
    20%, 61% { opacity: .2; }
    62% { opacity: .6; }
  }
  body.dark #light { animation: flicker-fast .4s infinite; }
  @keyframes flicker-fast { 0%,100% { opacity: .15; } 50% { opacity: .5; } }
  #shade {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 3;
    background: #000;
    opacity: 0;
    transition: opacity .8s;
  }
  body.dark #shade { opacity: .45; }
  #fade {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 4;
    background: #000;
    opacity: 0;
    transition: opacity .6s;
  }
  #fade.on { opacity: 1; }

  h1 { font-size: clamp(28px, 7vw, 56px); margin: 0 0 8px; letter-spacing: 4px; color: #e8e8e8; text-shadow: 0 0 18px rgba(194,35,35,.6); }
  .sub { color: var(--dim); margin: 0 0 28px; text-align: center; line-height: 1.6; }
  button.big {
    font: inherit; font-size: 18px;
    padding: 12px 32px;
    background: transparent; color: var(--text);
    border: 1px solid var(--dim); border-radius: 4px;
    cursor: pointer;
  }
  button.big:hover { border-color: var(--text); background: rgba(255,255,255,.05); }

  #hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; color: var(--dim); font-size: 14px; z-index: 2; }
  #msg {
    position: fixed; left: 16px; right: 16px; top: 44px;
    z-index: 2;
    min-height: 40px;
    font-size: clamp(18px, 4.5vw, 26px);
    text-align: center;
    line-height: 1.5;
    text-shadow: 0 0 8px #000, 0 0 2px #000;
    transition: opacity .3s;
  }
  #msg .ghost-say { color: #b9c9c1; font-style: italic; }

  /* ---------- 칸 고르기 화면 ---------- */
  #room {
    position: relative;
    width: 100%;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(0,0,0,.25) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(0,0,0,.25) 39px 40px),
      var(--wall);
    border-radius: 6px;
    padding: 24px 12px 40px;
  }
  #stalls { display: flex; gap: 8px; justify-content: center; }
  .stall {
    flex: 1; max-width: 150px;
    aspect-ratio: 1 / 2;
    position: relative;
    background: #0e1210;
    border: 3px solid var(--door-edge);
    border-bottom: none;
    cursor: pointer;
  }
  .door {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--door), #45534b 50%, var(--door));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  .stall:hover .door { filter: brightness(1.25); }
  .door .num { font-size: 22px; color: #9aa8a1; }
  .door .lock { width: 34px; height: 12px; border-radius: 2px; background: #2f7a3b; }
  .stall .gap { position: absolute; left: 0; right: 0; bottom: -14px; height: 14px; background: rgba(0,0,0,.6); }

  /* ---------- 1인칭: 칸 안에서 문을 본다 ---------- */
  #pov {
    position: fixed; inset: 0;
    display: none;
    overflow: hidden;
    background: #060807;
  }
  #pov.on { display: block; }
  #pov.shake { animation: shake .09s 4; }
  #povInner { position: absolute; inset: 0; animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1.02) translateY(0); } 50% { transform: scale(1.04) translateY(-4px); } }
  /* 바닥 */
  .p-floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 16%;
    background:
      repeating-linear-gradient(90deg, transparent 0 59px, rgba(0,0,0,.35) 59px 61px),
      linear-gradient(#1a201d, #0d100f);
  }
  /* 좌우 칸막이 */
  .p-wall {
    position: absolute; top: 0; bottom: 0; width: 22%;
    background: linear-gradient(90deg, #252e29, #1a211d);
  }
  .p-wall.l { left: 0; clip-path: polygon(0 0, 100% 8%, 100% 88%, 0 100%); }
  .p-wall.r { right: 0; clip-path: polygon(0 8%, 100% 0, 100% 100%, 0 88%); background: linear-gradient(270deg, #252e29, #1a211d); }
  .p-wall .scribble {
    position: absolute; top: 40%; left: 25%;
    font-size: clamp(10px, 1.6vw, 15px);
    color: rgba(150,30,30,.55);
    transform: rotate(-8deg);
    font-family: cursive;
    white-space: nowrap;
  }
  .p-wall.r .scribble { left: auto; right: 20%; top: 55%; transform: rotate(5deg); color: rgba(200,210,200,.18); }
  /* 문 바깥 (문이 열리면 보이는 어둠) */
  #povOutside {
    position: absolute; left: 22%; right: 22%; top: 8%; bottom: 12%;
    background: radial-gradient(ellipse at 50% 60%, #1b1f1d, #000 70%);
  }
  #povDoor {
    position: absolute; left: 22%; right: 22%; top: 8%; bottom: 14%;
    background:
      linear-gradient(90deg, rgba(0,0,0,.25), transparent 8%, transparent 92%, rgba(0,0,0,.25)),
      linear-gradient(#4a5850, #3a463f);
    border: 3px solid #2a332e;
    transform-origin: right center;
    transition: transform .25s ease-in;
  }
  #povDoor.open { transform: perspective(900px) rotateY(80deg); }
  #povDoor.bang { animation: bang .14s; }
  @keyframes bang { 0%,100% { transform: translate(0,0); } 30% { transform: translate(0,-3px) scale(1.012); } 60% { transform: translate(2px,1px); } }
  .p-hook { position: absolute; top: 18%; left: 50%; width: 18px; height: 26px; margin-left: -9px; border: 4px solid #6d7a73; border-top: none; border-radius: 0 0 10px 10px; }
  .p-lock {
    position: absolute; top: 48%; left: 6%;
    width: clamp(46px, 8vw, 80px); height: clamp(18px, 3vw, 28px);
    background: #222;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(9px, 1.4vw, 13px); color: #fff;
  }
  .p-lock span { background: var(--red); padding: 1px 6px; border-radius: 2px; }
  .p-hinge { position: absolute; right: -6px; width: 6px; height: 12%; background: #6d7a73; }
  .p-hinge.t { top: 10%; } .p-hinge.b { bottom: 10%; }
  /* 문 아래 틈: 바깥 불빛과 귀신 발 */
  #povGap {
    position: absolute; left: 22%; right: 22%; bottom: 12%; height: 2%;
    background: linear-gradient(#9fb3a8, #5e6c64);
    overflow: hidden;
    box-shadow: 0 0 18px rgba(170,200,185,.25);
  }
  body.dark #povGap { background: linear-gradient(#56645c, #2c3530); }
  #povFeet {
    position: absolute; bottom: 0;
    width: 16%; height: 100%;
    left: -40%;
    display: flex; gap: 14%;
    transition-property: left;
    transition-timing-function: linear;
  }
  #povFeet i { flex: 1; background: #050505; border-radius: 40% 40% 0 0; }
  #povShadow {
    position: absolute; bottom: 12%; height: 30%;
    width: 30%; left: -60%;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.55), transparent 70%);
    transition-property: left;
    transition-timing-function: linear;
    pointer-events: none;
  }

  /* 점프스케어 */
  #scare {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #000;
    z-index: 10;
  }
  #scare.on { display: flex; animation: shake .08s infinite; }
  @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-8px,5px); } 50% { transform: translate(6px,-6px); } 75% { transform: translate(-4px,-3px); } }
  #scareImg {
    width: min(90vw, 90vh);
    height: auto;
    image-rendering: pixelated;
    animation: zoom .25s ease-out;
  }
  @keyframes zoom { from { transform: scale(.2); } to { transform: scale(1); } }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.88);
    z-index: 5;
    padding: 16px;
  }
  #overlay.hide { display: none; }
  .red { color: var(--red); }
</style>
</head>
<body>
<div id="game">
  <div id="room"><div id="stalls"></div></div>
</div>

<div id="pov">
  <div id="povInner">
    <div class="p-floor"></div>
    <div class="p-wall l"><span class="scribble">나가지 마</span></div>
    <div class="p-wall r"><span class="scribble">걱 걱 걱</span></div>
    <div id="povOutside"></div>
    <div id="povShadow"></div>
    <div id="povGap"><div id="povFeet"><i></i><i></i></div></div>
    <div id="povDoor">
      <div class="p-hook"></div>
      <div class="p-lock"><span>사용중</span></div>
      <div class="p-hinge t"></div><div class="p-hinge b"></div>
    </div>
  </div>
</div>

<div id="hud"><span id="round">라운드 1</span><span id="best">최고 기록 0</span></div>
<div id="msg">&nbsp;</div>
<div id="light"></div>
<div id="shade"></div>
<div id="fade"></div>

<div id="scare"><img id="scareImg" alt=""></div>

<div id="overlay">
  <h1>걱걱걱 귀신 게임</h1>
  <p class="sub">화장실 칸 하나를 골라 숨어라.<br>걱걱걱 귀신이 문을 두드리고 다닌다...<br>소리 켜고 플레이하세요 🎧 (이어폰 추천)</p>
  <button class="big" id="startBtn">들어가기</button>
</div>

<script>
const STALLS = 3;
const DECOYS = 1; // 귀신이 정한 칸 전에 먼저 두드려 보는 칸 수
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 갑툭튀 이미지: 10th_life 1~21 프레임 애니메이션, 5% 확률로 Sprite-0001 */
const SCARE_FRAMES = Array.from({ length: 21 }, (_, i) => `10th_life${i + 1}.png`);
const RARE_SCARE = 'Sprite-0001.png';
const RARE_CHANCE = 0.05;
const FRAME_MS = 60;
const BREATH_VOL = 0.35; // 숨소리 전체 볼륨 배율 (1 = 원래 크기)
[...SCARE_FRAMES, RARE_SCARE].forEach(src => { new Image().src = src; });

let round = 1;
let best = 0;
let playerStall = -1;
let ghostPos = -1.5; // 귀신 위치 (칸 번호 기준, 음수 = 입구 쪽)
try { best = +localStorage.getItem('gukguk-best') || 0; } catch (e) {}

/* ---------- 사운드 (Web Audio로 직접 합성) ---------- */
let ac, master, drone;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain();
  master.gain.value = 0.9;
  master.connect(ac.destination);
}
function noiseBuffer(sec) {
  const buf = ac.createBuffer(1, ac.sampleRate * sec, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
// pos 위치에서 난 소리: 내 칸에서 멀수록 작고, 좌우로 갈린다
function spot(pos) {
  if (pos == null) return master;
  const d = pos - playerStall;
  const g = ac.createGain();
  g.gain.value = 1 / (1 + Math.abs(d) * 0.8);
  const f = ac.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.value = 8000 / (1 + Math.abs(d) * 1.5);
  g.connect(f);
  if (ac.createStereoPanner) {
    const p = ac.createStereoPanner();
    p.pan.value = Math.max(-1, Math.min(1, d / 2));
    f.connect(p).connect(master);
  } else {
    f.connect(master);
  }
  return g;
}
function knockSound(vol = 1, pos) {
  const out = spot(pos);
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.1);
  g.gain.setValueAtTime(0.9 * vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g).connect(out);
  o.start(t); o.stop(t + 0.16);

  const n = ac.createBufferSource();
  n.buffer = noiseBuffer(0.06);
  const f = ac.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.2;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.5 * vol, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  n.connect(f).connect(ng).connect(out);
  n.start(t);
}
function footstep(vol = 0.35, pos) {
  const out = spot(pos);
  const t = ac.currentTime;
  const n = ac.createBufferSource();
  n.buffer = noiseBuffer(0.12);
  const f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 400;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  n.connect(f).connect(g).connect(out);
  n.start(t);
}
function creak(dur = 0.9, vol = 0.18, pos) {
  const out = spot(pos);
  const t = ac.currentTime;
  const o = ac.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(320, t);
  o.frequency.linearRampToValueAtTime(520, t + dur * 0.4);
  o.frequency.linearRampToValueAtTime(260, t + dur);
  const lfo = ac.createOscillator();
  const lg = ac.createGain();
  lfo.frequency.value = 28; lg.gain.value = 40;
  lfo.connect(lg).connect(o.frequency);
  const f = ac.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 4;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.1);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(f).connect(g).connect(out);
  o.start(t); lfo.start(t);
  o.stop(t + dur); lfo.stop(t + dur);
}
function gukSound(vol = 0.35, pos) {
  // 목 긁는 듯한 '걱' 소리
  const out = spot(pos);
  const t = ac.currentTime;
  const o = ac.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.22);
  const am = ac.createOscillator();
  const amg = ac.createGain();
  am.frequency.value = 45; amg.gain.value = 0.5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  am.connect(amg).connect(g.gain);
  const f = ac.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900;
  o.connect(f).connect(g).connect(out);
  o.start(t); am.start(t);
  o.stop(t + 0.26); am.stop(t + 0.26);
}
// 내 숨소리: 들숨/날숨 한 번
function breathSound(inhale, dur, vol) {
  const t = ac.currentTime;
  const n = ac.createBufferSource();
  n.buffer = noiseBuffer(dur);
  const f = ac.createBiquadFilter();
  f.type = 'bandpass';
  f.Q.value = 0.8;
  f.frequency.setValueAtTime(inhale ? 900 : 1300, t);
  f.frequency.linearRampToValueAtTime(inhale ? 1500 : 700, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol * BREATH_VOL, t + dur * (inhale ? 0.7 : 0.25));
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  n.connect(f).connect(g).connect(master);
  n.start(t);
}
let breathing = false;
let breathHold = false;
let breathId = 0;
async function breathLoop() {
  const id = ++breathId; // 이전 라운드 루프가 겹쳐 돌지 않게
  while (breathing && id === breathId) {
    if (breathHold) { await sleep(150); continue; }
    // 귀신이 가까울수록 숨이 빠르고 거칠어진다
    const tension = document.body.classList.contains('dark') ? nearness(ghostPos) : 0;
    const s = 1 - 0.55 * tension;
    const vol = 0.05 + 0.09 * tension;
    breathSound(true, 1.1 * s, vol);
    await sleep(1150 * s);
    if (!breathing || breathHold) continue;
    breathSound(false, 1.3 * s, vol * 1.1);
    await sleep((1300 + 500) * s);
  }
}
async function holdBreath(on) {
  if (on) {
    breathSound(true, 0.35, 0.14); // 헉 하고 숨을 참는다
    breathHold = true;
  } else {
    breathHold = false;
  }
}

function heartbeat() {
  const t = ac.currentTime;
  [0, 0.22].forEach((dt, k) => {
    const o = ac.createOscillator();
    o.frequency.setValueAtTime(60, t + dt);
    o.frequency.exponentialRampToValueAtTime(35, t + dt + 0.15);
    const g = ac.createGain();
    g.gain.setValueAtTime(k ? 0.35 : 0.5, t + dt);
    g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.18);
    o.connect(g).connect(master);
    o.start(t + dt); o.stop(t + dt + 0.2);
  });
}
function startDrone() {
  if (drone) return;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.frequency.value = 55; o2.frequency.value = 58.3;
  const g = ac.createGain();
  g.gain.value = 0.0001;
  g.gain.linearRampToValueAtTime(0.06, ac.currentTime + 3);
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(); o2.start();
  drone = { o1, o2, g };
}
function droneLevel(v, sec = 1.5) {
  if (!drone) return;
  drone.g.gain.cancelScheduledValues(ac.currentTime);
  drone.g.gain.setValueAtTime(drone.g.gain.value, ac.currentTime);
  drone.g.gain.linearRampToValueAtTime(v, ac.currentTime + sec);
}
function screamSound() {
  const t = ac.currentTime;
  const n = ac.createBufferSource();
  n.buffer = noiseBuffer(1.4);
  const ng = ac.createGain();
  ng.gain.setValueAtTime(0.6, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
  n.connect(ng).connect(master);
  n.start(t);
  [220, 233, 311, 466].forEach(fq => {
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(fq, t);
    o.frequency.linearRampToValueAtTime(fq * 1.5, t + 1.2);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 1.4);
  });
}

/* ---------- 화면 ---------- */
// near: 0(멀리) ~ 1(바로 앞). 멀리서 난 소리는 글씨도 흐리게
function say(html, near = 1) {
  const m = $('#msg');
  m.innerHTML = html;
  m.style.opacity = 0.35 + 0.65 * near;
}
function ghostSay(text, near) { say(`<span class="ghost-say">${text}</span>`, near); }
function nearness(pos) { return 1 / (1 + Math.abs(pos - playerStall)); }
function updateHud() {
  $('#round').textContent = `라운드 ${round}`;
  $('#best').textContent = `최고 기록 ${best}`;
}

function buildStalls() {
  const wrap = $('#stalls');
  wrap.innerHTML = '';
  for (let i = 0; i < STALLS; i++) {
    const s = document.createElement('div');
    s.className = 'stall';
    s.innerHTML = `<div class="door"><span class="num">${i + 1}</span><span class="lock"></span></div><div class="gap"></div>`;
    s.addEventListener('click', () => choose(i));
    wrap.appendChild(s);
  }
}

// 귀신 발/그림자를 문 틈에 배치. 내 칸 앞이면 정중앙, 옆 칸이면 화면 밖
function placeFeet(pos, ms) {
  const d = pos - playerStall;
  const feet = $('#povFeet'), shadow = $('#povShadow');
  feet.style.transitionDuration = shadow.style.transitionDuration = ms + 'ms';
  feet.style.left = (42 + d * 75) + '%';
  shadow.style.left = (35 + d * 60) + '%';
}

async function walkTo(target) {
  const dist = Math.abs(target - ghostPos);
  const steps = Math.max(2, Math.round(dist * 3));
  const stepMs = 430;
  const start = ghostPos;
  for (let k = 1; k <= steps; k++) {
    ghostPos = start + (target - start) * k / steps;
    placeFeet(ghostPos, stepMs);
    footstep(0.3 + 0.1 * Math.random(), ghostPos);
    await sleep(stepMs);
  }
}

function bangDoor() {
  const door = $('#povDoor');
  door.classList.remove('bang');
  void door.offsetWidth;
  door.classList.add('bang');
}

async function knockOn(i, wait) {
  const mine = i === playerStall;
  const near = nearness(i);
  let txt = '';
  for (let k = 0; k < 3; k++) {
    knockSound(mine ? 1.4 : 1, i);
    if (mine) bangDoor();
    txt += (k ? ' ' : '') + '똑';
    say(mine ? `<b>${txt}</b>` : txt, near);
    await sleep(mine ? 450 : 380);
  }
  if (mine) {
    // 문 앞에 서서 숨소리를 듣는다
    say('(숨을 참는다...)', 1);
    holdBreath(true);
    for (let t = 0; t < wait; t += 700) { heartbeat(); await sleep(700); }
    holdBreath(false);
  } else {
    await sleep(wait);
  }
}

/* ---------- 게임 흐름 ---------- */
let choosing = false;

function startRound() {
  updateHud();
  buildStalls();
  $('#pov').classList.remove('on');
  $('#povDoor').classList.remove('open');
  $('#room').style.display = '';
  document.body.classList.remove('dark');
  playerStall = -1;
  ghostPos = -1.5;
  choosing = true;
  say('숨을 칸을 골라라...');
  droneLevel(0.06);
}

async function choose(i) {
  if (!choosing) return;
  choosing = false;
  playerStall = i;
  creak(0.5, 0.12);
  // 칸 안으로 들어간다
  $('#fade').classList.add('on');
  await sleep(600);
  $('#room').style.display = 'none';
  $('#pov').classList.add('on');
  placeFeet(ghostPos, 0);
  breathing = true;
  breathHold = false;
  breathLoop();
  say('');
  knockSound(0.5); // 잠금 소리
  await sleep(300);
  $('#fade').classList.remove('on');
  play();
}

function pickRoute() {
  // 귀신이 나타날 칸(target)을 랜덤으로 정하고,
  // 그 전에 다른 칸 2곳을 두드리며 뜸을 들인다 (플레이어 칸일 수도 있다)
  const target = Math.floor(Math.random() * STALLS);
  const others = [...Array(STALLS).keys()].filter(i => i !== target);
  for (let i = others.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  return { decoys: others.slice(0, DECOYS), target };
}

async function play() {
  say(`${playerStall + 1}번 칸. 문을 잠갔다.`);
  await sleep(2000);
  say('...');
  await sleep(1500);
  say('끼이익— (화장실 문이 열렸다)', nearness(-1.5));
  creak(1.2, 0.3, -1.5);
  await sleep(1300);
  droneLevel(0.12);
  document.body.classList.add('dark');
  ghostSay('걱... 걱... 걱...', nearness(-1.5));
  for (let k = 0; k < 3; k++) { gukSound(0.5, ghostPos); await sleep(450); }
  await sleep(500);

  const { decoys, target } = pickRoute();
  for (const i of decoys) {
    say('저벅... 저벅...', 0.6);
    await walkTo(i);
    await sleep(700);
    await knockOn(i, i === playerStall ? 2400 : 900 + Math.random() * 900);

    if (i !== playerStall) {
      creak(0.9, 0.3, i);
      say('끼이익—', nearness(i));
      await sleep(900);
    }
    ghostSay(Math.random() < 0.5 ? '여긴... 없네...' : '여기도... 없어...', nearness(i));
    gukSound(0.35, i);
    await sleep(1400);
  }

  // 귀신이 정한 칸
  say('저벅... 저벅...', 0.6);
  await walkTo(target);
  await sleep(1000);
  await knockOn(target, 2000 + Math.random() * 1200);
  if (target === playerStall) return caught();

  creak(0.9, 0.3, target);
  say('끼이익—', nearness(target));
  await sleep(900);
  ghostSay('...여기도... 없네...', nearness(target));
  gukSound(0.35, target);
  await sleep(1400);

  // 귀신이 나간다
  ghostSay('걱... 걱...', nearness(ghostPos));
  gukSound(0.3, ghostPos);
  await walkTo(-1.5);
  creak(1, 0.25, -1.5);
  say('끼이익— 쾅.', nearness(-1.5));
  document.body.classList.remove('dark');
  droneLevel(0.03);
  breathing = false;
  await sleep(300);
  breathSound(false, 2.2, 0.13); // 휴... 안도의 한숨
  await sleep(1500);
  survived();
}

async function caught() {
  // 문이 벌컥 열린다
  creak(0.3, 0.4);
  $('#povDoor').classList.add('open');
  await sleep(250);
  const img = $('#scareImg');
  const rare = Math.random() < RARE_CHANCE;
  img.src = rare ? RARE_SCARE : SCARE_FRAMES[0];
  $('#scare').classList.add('on');
  screamSound();
  droneLevel(0.0001, 0.2);
  breathing = false;
  if (!rare) {
    for (const src of SCARE_FRAMES.slice(1)) {
      await sleep(FRAME_MS);
      img.src = src;
    }
  }
  setTimeout(() => {
    $('#scare').classList.remove('on');
    const score = round - 1;
    if (score > best) {
      best = score;
      try { localStorage.setItem('gukguk-best', best); } catch (e) {}
    }
    showOverlay(
      `<h1 class="red">찾았다.</h1><p class="sub">${playerStall + 1}번 칸에서 잡혔다.<br>버틴 라운드: <b>${score}</b> · 최고 기록: <b>${best}</b></p>`,
      '다시 하기',
      () => { round = 1; startRound(); }
    );
  }, 1300);
}

function survived() {
  showOverlay(
    `<h1>살았다...</h1><p class="sub">귀신이 나갔다. 아직은.<br>라운드 ${round} 생존</p>`,
    '다음 라운드',
    () => { round++; startRound(); }
  );
}

function showOverlay(html, btnText, onClick) {
  const o = $('#overlay');
  o.innerHTML = `${html}<button class="big">${btnText}</button>`;
  o.classList.remove('hide');
  o.querySelector('button').onclick = () => { o.classList.add('hide'); onClick(); };
}

$('#startBtn').onclick = () => {
  initAudio();
  ac.resume();
  startDrone();
  $('#overlay').classList.add('hide');
  startRound();
};
updateHud();
buildStalls();
</script>
